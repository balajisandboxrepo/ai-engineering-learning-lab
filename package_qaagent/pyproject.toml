[project]
name = "qaagent"
version = "0.1.0"
description = "A Python package for QA agent experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.8",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
